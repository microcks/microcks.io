# Announce a Microcks release on the website.
#
# HOW TO USE (maintainers)
#   1. Before the release, prepare the announcement as blog/microcks-<version>-release.md with
#      `draft: true` in its front matter. Draft posts are excluded from the production build.
#   2. After the technical release (tag, images, packages), wait a few days and run the final checks.
#      Releasing and announcing are deliberately two separate steps.
#   3. Run this workflow from the Actions tab ("Run workflow") with the version, e.g. 1.16.0, and
#      the blog post file when there is one.
#   4. It opens a pull request with these changes:
#      - src/data/home.js: LATEST_RELEASE, and the hero link, which points to the blog post when one
#        is given and to the GitHub release otherwise
#      - static/_redirects, docs/references/apis/open-api.mdx and async-api.mdx: the pinned
#        OpenAPI/AsyncAPI descriptions, bumped only when upstream published a newer one
#      - the blog post: `draft: true` removed and the date set to today
#   5. Review the Netlify deploy preview, then merge the PR. Merging is the announcement.
#
# NOT AUTOMATED, check by hand when relevant: the operator `version:` examples in
# docs/guides/installation/kubernetes-operator.md and the version examples in the Testcontainers and
# troubleshooting guides.
name: Announce release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released Microcks version, for example 1.16.0 (the GitHub release must exist)'
        required: true
        type: string
      blog_post:
        description: 'Optional prepared draft post, for example blog/microcks-1.16.0-release.md'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  announce:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update the site content
        id: update
        env:
          VERSION: ${{ inputs.version }}
          BLOG_POST: ${{ inputs.blog_post }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--version "$VERSION")
          if [ -n "$BLOG_POST" ]; then args+=(--blog "$BLOG_POST"); fi
          node scripts/announce-release.mjs "${args[@]}" | tee report.md
          if git diff --quiet; then
            echo "Nothing to change: the site already announces $VERSION." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests and build
        if: steps.update.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Commit, push and open the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/announce-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A src static docs blog
          git commit -s -m "chore(release): announce Microcks $VERSION" -m "Generated by the Announce release workflow."
          git push --force-with-lease origin "$branch"

          {
            echo "Announces Microcks $VERSION on the website. Generated by the Announce release workflow."
            echo
            cat report.md
            echo
            echo "Review the Netlify deploy preview, then merge to announce."
          } > pr-body.md

          if ! gh pr create --base main --head "$branch" --title "chore(release): announce Microcks $VERSION" --body-file pr-body.md; then
            {
              echo "Branch \`$branch\` is pushed but the pull request could not be created."
              echo "GitHub Actions may not be allowed to create pull requests (repository Settings, Actions, General)."
              echo
              echo "Open it here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
